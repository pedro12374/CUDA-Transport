# Standard Map escape-time/basin scan over K. Demonstrates the discrete-map
# path (run_map_generic) as a worked example alongside the Horton ODE path.
# Run with: ./run_standard_map configs/standard_map_escape.cfg
#
# Reproduces what main_Escape.cu.bkp used to hardcode.
#
# NOTE: iterations = 1e7 is a genuinely long run (this was flagged in
# CLAUDE.md as something to launch via tmux, not interactively/for a quick
# test -- shrink `iterations` and/or `grid_dims` for a quick smoke test).

calculation = escape
iterations = 10000000

grid_dims = 1024, 1024
grid_min = -3.14159265358979, 0.0
grid_max = 3.14159265358979, 6.28318530717959

output_file = dat/standard_map_escape.h5

K = 0.5, 0.971635, 1.5, 6.47
