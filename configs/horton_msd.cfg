# Horton (three-wave drift) MSD/displacement scan over A2 x A3.
# Run with: ./run_horton configs/horton_msd.cfg
#
# Reproduces what main_horton_msd.cu used to hardcode.

calculation = msd

dt = 0.01
final_time = 1e5

# Grid: 1024x1024 particles over x in [-pi,pi], y in [-2pi,2pi]
grid_dims = 1024, 1024
grid_min = -3.14159265358979, -6.28318530717959
grid_max = 3.14159265358979, 6.28318530717959

output_file = dat/horton_msd_A2_A3.h5

# Number of logarithmically-spaced MSD samples per run (see CLAUDE.md /
# Phase 2 notes -- keeps the MSD dataset small at large final_time/dt).
msd_samples = 300
# steps_per_batch = 20000

# --- System parameters ---
A1 = 1.0
A2 = 0.0, 0.1, 0.5, 1.0
A3 = 0.0, 0.1, 0.5

kx1 = 6.0
ky1 = 3.0
w1 = 0.476
kx2 = -3.5
ky2 = -1.5
w2 = 0.476
kx3 = -2.5
ky3 = -1.5
w3 = 0.476
