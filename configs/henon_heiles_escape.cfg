# Henon-Heiles escape-time/basin scan over initial position (x0, y0),
# released from rest (px0 = py0 = 0) -- the classic way this paradigmatic
# escape system's fractal 3-basin structure is visualized.
# Run with: ./run_henon_heiles configs/henon_heiles_escape.cfg

calculation = escape

dt = 0.01
final_time = 1000

# grid_dims/min/max always need one entry per dimension (x, y, px, py).
# px0, py0 are single-point dimensions (fixed at 0) -- only (x0,y0) is
# actually scanned.
grid_dims = 200, 200, 1, 1
grid_min = -1.2, -1.2, 0.0, 0.0
grid_max = 1.2, 1.2, 0.0, 0.0

output_file = dat/henon_heiles_escape.h5

# lambda = 1.0 is the standard Henon-Heiles Hamiltonian.
lambda = 1.0
