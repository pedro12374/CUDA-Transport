# Horton (three-wave drift) escape-time/basin scan over A2 x A3.
# Run with: ./run_horton configs/horton_escape.cfg
#
# Reproduces what main_horton_escape.cu used to hardcode.

calculation = escape

dt = 0.01
final_time = 1e5

# Grid: 1024x1024 particles over x in [-pi,pi], y in [-2pi,2pi]
grid_dims = 1024, 1024
grid_min = -3.14159265358979, -6.28318530717959
grid_max = 3.14159265358979, 6.28318530717959

output_file = dat/horton_escape_A2_A3.h5

# Optional: kernel steps per launch (batches long runs; see CLAUDE.md).
# steps_per_batch = 20000

# --- System parameters ---
# A2, A3 are comma-separated -> this sweeps all 4x3 = 12 combinations,
# one EscapeTime_A2_..._A3_... / EscapeBasin_A2_..._A3_... dataset pair each.
A1 = 1.0
A2 = 0.0, 0.1, 0.5, 1.0
A3 = 0.0, 0.1, 0.5

kx1 = 6.0
ky1 = 3.0
w1 = 0.476
kx2 = -3.5
ky2 = -1.5
w2 = 0.476
kx3 = -2.5
ky3 = -1.5
w3 = 0.476
