# Standard Map phase-space, zoomed into a small (p, theta) region -- matches
# what main_PS.cu.bkp (removed in Phase 1) used to hardcode; restored here
# for Presentation/plt.py, which reads this file's output.
# Run with: ./run_standard_map configs/standard_map_phasespace_zoom.cfg

calculation = phasespace
iterations = 10000

grid_dims = 10, 10
grid_min = 0.0, 0.0
grid_max = 0.2, 0.5

output_file = dat/standard_map_phasespace_zoom.h5

K = 0.5, 0.971635, 1.5, 6.47
