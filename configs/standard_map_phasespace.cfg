# Standard Map phase-space trajectories over K. calculate_phase_space is
# CPU-only (no GPU kernel exists for it) -- fine at this size, would be slow
# at 1024x1024/many iterations.
# Run with: ./run_standard_map configs/standard_map_phasespace.cfg

calculation = phasespace
iterations = 200

grid_dims = 50, 50
grid_min = -3.14159265358979, 0.0
grid_max = 3.14159265358979, 6.28318530717959

output_file = dat/standard_map_phasespace.h5

K = 0.5, 0.971635, 1.5, 6.47
