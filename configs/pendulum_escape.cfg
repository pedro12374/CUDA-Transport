# Driven, damped pendulum escape-basin scan over initial (theta0, p0), for
# a few driving amplitudes A spanning the transition to chaos.
# Run with: ./run_pendulum configs/pendulum_escape.cfg
# (see TUTORIAL.md, which builds this system and this config from scratch)

calculation = escape

dt = 0.01
final_time = 100

grid_dims = 200, 200
grid_min = -3.14159265358979, -2.0
grid_max = 3.14159265358979, 2.0

output_file = dat/pendulum_escape.h5

gamma = 0.5
A = 1.0, 1.5, 2.0
omega_drive = 0.666667
